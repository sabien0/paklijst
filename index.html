<style>
:root{--bg:#f5f1ea;--card:#fffdf9;--ink:#26231f;--muted:#776f66;--line:#e5ddd1;--accent:#2f6a70;--accent-soft:#e0eded;--on-accent:#fff;--ok:#3e7a55;--ok-soft:#e3efe6;--warm:#b0672b;--warm-soft:#f6e8da;--danger:#b3392f;--shadow:0 6px 18px rgba(40,25,15,.14)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1d1d;--card:#252828;--ink:#eef0ec;--muted:#a2a69f;--line:#373b3a;--accent:#7cc3c6;--accent-soft:#223637;--on-accent:#1b1d1d;--ok:#7cc497;--ok-soft:#24342a;--warm:#e3a56f;--warm-soft:#3a2e24;--danger:#e8877e;--shadow:0 6px 18px rgba(0,0,0,.45)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.hidden{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(130px + env(safe-area-inset-bottom))}
.hd{display:flex;align-items:center;gap:8px}
.hd h1{font-family:Fraunces,Georgia,serif;font-weight:650;font-size:28px;line-height:1.15;margin:0;letter-spacing:-.01em;flex:1}
.ic{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:16px;color:var(--muted);flex:none;padding:0}
.sub{color:var(--muted);font-size:13.5px;margin:2px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sync{font-size:12px;color:var(--ok);display:inline-flex;align-items:center;gap:5px}
.sync:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.sync.busy{color:var(--muted)}.sync.err{color:var(--warm)}
.prog{height:5px;border-radius:9px;background:var(--line);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .35s}
h3.sec{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:17px;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
h3.sec .n{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);font-weight:400}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:14px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrapc{flex-wrap:wrap;overflow:visible;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;flex:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 14px}
.card.warm{background:var(--warm-soft);border-color:transparent}
.it{display:flex;align-items:center;gap:11px;padding:8px 0;border-top:1px solid var(--line);min-height:50px;cursor:pointer}
.it:first-child{border-top:0}
.cb{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--muted);opacity:.7;flex:none;display:grid;place-items:center;font-size:12px;color:var(--on-accent)}
.cb.on{background:var(--accent);border-color:var(--accent);opacity:1}
.it .t{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.it .t small{display:block;color:var(--muted);font-size:12px;line-height:1.3;margin-top:1px}
.it.done .t{color:var(--muted);text-decoration:line-through}
.it.over{cursor:default}.it.over .t{color:var(--muted)}
.q{display:inline-block;font-size:12.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:0 6px;margin-right:4px;text-decoration:none}
.x{width:36px;height:36px;border:0;background:none;color:var(--muted);flex:none;padding:0;font-size:18px;border-radius:8px;opacity:.7}
.btn{border-radius:12px;padding:10px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:500;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.block{display:block;width:100%}
.empty{color:var(--muted);text-align:center;padding:36px 10px;font-size:14px}
.empty b{display:block;font-family:Fraunces,Georgia,serif;font-weight:500;font-size:18px;color:var(--ink);margin-bottom:4px}
.search{margin-top:14px}
/* reis */
.reis{margin-top:16px;padding:4px 14px 12px}
.reis-hd{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:8px 0 4px;text-align:left}
.reis-hd b{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:17px}
.reis-hd span{flex:1;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reis-hd i{font-style:normal;color:var(--muted);transition:transform .2s}
.reis.dicht .reis-hd i{transform:rotate(-90deg)}
.nacht{display:flex;align-items:center;gap:10px;margin-top:6px}
.nacht .l{flex:1;font-size:14px}
.nacht .l small{display:block;color:var(--muted);font-size:12px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg)}
.step button{width:40px;height:36px;border:0;background:none;font-size:18px;color:var(--accent)}
.step b{min-width:34px;text-align:center;font-family:Fraunces,Georgia,serif;font-weight:500;font-size:18px}
.lbl{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 10px calc(10px + env(safe-area-inset-bottom));z-index:20}
.nav button{flex:1;max-width:180px;background:none;border:0;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button b{font-size:19px;font-weight:400;line-height:1.2}
.nav button.on{color:var(--accent);font-weight:600}
.fab{position:fixed;right:max(18px,calc(50% - 302px));bottom:calc(80px + env(safe-area-inset-bottom));background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:12px 18px;font-weight:600;font-size:14px;box-shadow:var(--shadow);z-index:15}
details.blok{margin-top:18px}
details.blok summary{list-style:none;font-family:Fraunces,Georgia,serif;font-weight:500;font-size:17px;display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer}
details.blok summary::-webkit-details-marker{display:none}
details.blok summary .n{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);font-weight:400}
details.blok summary:after{content:"›";color:var(--muted);transition:transform .2s;margin-left:2px}
details.blok[open] summary:after{transform:rotate(90deg)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-top:12px}
.seg button{flex:1;text-align:center;font-size:13px;padding:7px 4px;border-radius:9px;color:var(--muted);background:none;border:0}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.add-lib{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.add-lib:first-child{border-top:0}
.add-lib .t{flex:1}
.add-lib small{display:block;color:var(--muted);font-size:12px}
/* switch */
.switch{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;user-select:none;position:relative}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .sl{width:40px;height:24px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch .sl:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked + .sl{background:var(--accent)}
.switch input:checked + .sl:after{transform:translateX(16px)}
.switch .tx{flex:1}.switch .tx small{display:block;color:var(--muted);font-size:12px}
.opt-row{padding:12px 0;border-top:1px solid var(--line)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(15,15,12,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;border-radius:22px 22px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;animation:up .2s ease-out}
.sh{display:flex;align-items:center;gap:8px;padding:10px 16px 6px;flex:none}
.sh h2{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:21px;margin:0;flex:1;line-height:1.2}
.sb{overflow-y:auto;padding:6px 16px calc(22px + env(safe-area-inset-bottom));flex:1;overscroll-behavior:contain}
.sf{padding:10px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex:none;display:flex;gap:8px}
.sf .btn{flex:1}
.handle{width:38px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0;flex:none}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
details.set{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:10px}
details.set summary{padding:13px 14px;font-weight:500;list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer}
details.set summary::-webkit-details-marker{display:none}
details.set summary:after{content:"›";margin-left:auto;color:var(--muted);transition:transform .2s}
details.set[open] summary:after{transform:rotate(90deg)}
details.set .in{padding:0 14px 14px}
.setrow{display:flex;gap:6px;align-items:center;padding:5px 0}
.setrow input,.setrow select{padding:7px 9px;border-radius:9px;font-size:14px}
.setrow .em{width:46px;text-align:center;flex:none}
.setrow select{width:auto;flex:none}
.xs{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--muted);flex:none;padding:0;font-size:13px}
.info{color:var(--muted);font-size:13px;margin:4px 0 8px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;text-align:center}
.login h1{font-family:Fraunces,Georgia,serif;font-weight:650;font-size:38px;margin:0 0 6px}
.login p{color:var(--muted);margin:0 0 26px}
.status{font-size:13px;color:var(--muted);margin-top:12px;min-height:20px}
</style>
</head>

function migreer(o){
  o = o || {};
  const acts = o.activiteiten || OUD.activiteiten;
  const actItems = o.activiteitItems || OUD.activiteitItems;
  const bronCats = new Set(Object.values(o.actBronCat || OUD.actBronCat));
  const altijd = new Set(o.altijd || OUD.altijd);
  const verw = new Set(o.verwijderd || []);
  const bron = [...OUD_ITEMS, ...(o.altijdExtra || []), ...(o.activiteitExtra || [])].filter(i => i && i.naam && !verw.has(i.id));
  const extra = (o.extra || []).filter(i => i && i.naam);

  const cats = [], catId = {};
  const maakCat = naam => {
    if (catId[naam]) return catId[naam];
    const m = String(naam).match(/^(\S+)\s+(.+)$/);
    const c = {id:'c' + (cats.length + 1), emoji: m ? m[1] : '📦', naam: m ? m[2] : naam};
    cats.push(c); catId[naam] = c.id; return c.id;
  };
  const gebruikt = new Set([...bron, ...extra].map(i => i.cat));
  (o.catOrder || OUD.catOrder).filter(c => gebruikt.has(c)).forEach(maakCat);

  const groepen = acts.map(a => ({id:a.id, naam:a.label, emoji:a.emoji || '🎯', soort: a.groep === 'Bestemming' ? 'b' : 'a'}));
  const items = [], perNaam = {}, idMap = {};
  bron.forEach(i => {
    const k = i.naam.trim().toLowerCase();
    const gs = acts.filter(a => (actItems[a.id] || []).includes(i.id)).map(a => a.id);
    const isAltijd = altijd.has(i.id) && !bronCats.has(i.cat);
    const e = perNaam[k];
    if (e){ // dubbele naam (bijv. Kussen bij festival én kamperen): samenvoegen
      e.altijd = e.altijd || isAltijd;
      gs.forEach(g => { if (!e.groepen.includes(g)) e.groepen.push(g); });
      idMap[i.id] = e.id; return;
    }
    const it = {id:i.id, naam:i.naam, cat:maakCat(i.cat), altijd:isAltijd, groepen:gs, laatst:START_LAATST.has(i.id), perDagen:START_PERDAGEN[i.id] || 0, max:0};
    items.push(it); perNaam[k] = it; idMap[i.id] = i.id;
  });
  const map = obj => { const r = {}; Object.keys(obj || {}).forEach(id => { if (obj[id] && idMap[id]) r[idMap[id]] = true; }); return r; };
  const gepakt = map(o.gepakt);
  const overslaan = map(Object.fromEntries((o.uitgesloten || []).map(id => [id, true])));
  const los = extra.map(i => ({id:'l_' + i.id, naam:i.naam, cat:maakCat(i.cat), laatst:false}));
  extra.forEach(i => { if (o.gepakt?.[i.id]) gepakt['l_' + i.id] = true; if ((o.uitgesloten || []).includes(i.id)) overslaan['l_' + i.id] = true; });
  return vulAan({versie:1, cats, groepen, items,
    reis:{nachten:0, actief:(o.actief || []).filter(id => groepen.some(g => g.id === id)), gepakt, overslaan, los, extra:[]}});
}
function vulAan(s){
  s = s || {};
  s.cats = s.cats?.length ? s.cats : [{id:'c1', emoji:'🎒', naam:'Overig'}];
  s.groepen = s.groepen || []; s.items = s.items || [];
  s.items.forEach(i => { i.groepen = i.groepen || []; i.perDagen = i.perDagen || 0; i.max = i.max || 0; });
  s.reis = Object.assign({nachten:0, actief:[], gepakt:{}, overslaan:{}, los:[], extra:[]}, s.reis || {});
  return s;
}

// =====================================================================
//  STATE & BEREKENINGEN
// =====================================================================
let S = migreer({});
const R = () => S.reis;
const groep = id => S.groepen.find(g => g.id === id);
const cat = id => S.cats.find(c => c.id === id);
const item = id => S.items.find(i => i.id === id);
function aantal(i){
  const n = R().nachten; if (!n || !i.perDagen) return 0;
  let a = Math.ceil((n + 1) / i.perDagen);
  if (i.max) a = Math.min(a, i.max);
  return a;
}
// Alles wat op de paklijst van deze reis staat
function lijst(){
  const r = R(), uit = [];
  S.items.forEach(i => {
    const bron = i.groepen.filter(g => r.actief.includes(g));
    if (i.altijd || bron.length || r.extra.includes(i.id)) uit.push({...i, bron: i.altijd ? [] : bron, extra: !i.altijd && !bron.length});
  });
  r.los.forEach(l => uit.push({...l, los:true, bron:[], perDagen:0}));
  return uit;
}
function standaardCat(){
  const c = cat(A._laatsteCat) || S.cats.find(x => /^(rest|overig)$/i.test(x.naam)) || S.cats[0];
  return c.id;
}
function catVolgorde(){ const o = {}; S.cats.forEach((c, k) => o[c.id] = k); return id => o[id] ?? 999; }

// =====================================================================
//  OPSLAG & SYNC
// =====================================================================
let db = null, auth = null, user = null, laatsteRemote = '', pushTimer = null, syncStaat = 'ok';
const LS_KEY = DEMO ? 'pk2_demo' : 'pk2_cache';
function opslaan(){
  S.bijgewerkt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){}
  if (DEMO || !db || !user) return;
  clearTimeout(pushTimer); pushTimer = setTimeout(push, 400);
}
async function push(){
  clearTimeout(pushTimer); pushTimer = null;
  const str = JSON.stringify(S);
  if (str === laatsteRemote) return;
  zetSync('busy');
  try { laatsteRemote = str; await db.collection('paklijst').doc(user.uid).set({v2:str, bijgewerkt:Date.now()}, {merge:true}); zetSync('ok'); }
  catch(e){ console.error(e); laatsteRemote = ''; zetSync('err'); }
}
function zetSync(s){ syncStaat = s; const el = $('sync'); if (el){ el.className = 'sync' + (s === 'busy' ? ' busy' : s === 'err' ? ' err' : ''); el.textContent = s === 'busy' ? 'opslaan…' : s === 'err' ? 'offline · wordt later bewaard' : 'bewaard'; } }
function verwerkDoc(doc){
  if (!doc.exists || !doc.data().v2) return false;
  const v = doc.data().v2;
  if (v === laatsteRemote || doc.metadata?.hasPendingWrites || pushTimer) return true;
  laatsteRemote = v;
  try { S = vulAan(JSON.parse(v)); localStorage.setItem(LS_KEY, v); } catch(e){ console.error(e); }
  render(true); return true;
}
async function start(){
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  try { const c = localStorage.getItem(LS_KEY); if (c) S = vulAan(JSON.parse(c)); } catch(e){}
  render();
  try {
    const ref = db.collection('paklijst').doc(user.uid);
    const doc = await ref.get();
    if (!verwerkDoc(doc)){
      const oud = leesOud();
      S = migreer(oud); opslaan(); await push(); render();
      if (Object.keys(oud).length) toast('✓ Je oude paklijst is overgezet');
    }
    ref.onSnapshot(d => verwerkDoc(d), () => zetSync('err'));
  } catch(e){ console.error(e); zetSync('err'); }
}

let tab = 'lijst', zoek = '', reisOpen = null, filter = 'alles', koppelAlles = false, sheet = null;

function render(vanRemote){
  ['lijst','items'].forEach(t => $('nav-' + t).classList.toggle('on', t === tab));
  const p = $('page'), act = document.activeElement;
  const focusId = act && p.contains(act) ? act.id : null, sel = focusId ? act.selectionStart : 0;
  p.innerHTML = tab === 'lijst' ? lijstHTML() : itemsHTML();
  if ($('sync')){ if (DEMO) $('sync').remove(); else zetSync(syncStaat); }
  if (focusId && $(focusId)){ $(focusId).focus(); try { $(focusId).setSelectionRange(sel, sel); } catch(e){} }
  if (vanRemote && sheet) tekenSheet();
}

function rij(i, modus){
  const r = R(), done = modus === 'gedaan', over = modus === 'over';
  const a = aantal(i);
  const sub = i.los ? 'alleen deze reis' : i.extra ? 'toegevoegd voor deze reis' : i.bron.map(g => groep(g)).filter(Boolean).map(g => g.emoji + ' ' + g.naam).join(' · ');
  const knop = over ? `<button class="x" data-a="terug" data-x="${i.id}" title="Terugzetten">↩</button>`
    : `<button class="x" data-a="${i.los ? 'losWeg' : i.extra ? 'extraWeg' : 'slaOver'}" data-x="${i.id}" title="${i.los || i.extra ? 'Weghalen' : 'Overslaan deze reis'}">×</button>`;
  return `<div class="it${done ? ' done' : ''}${over ? ' over' : ''}" ${over ? '' : `data-a="pak" data-x="${i.id}"`}>
    ${over ? '' : `<span class="cb${done ? ' on' : ''}">${done ? '✓' : ''}</span>`}
    <span class="t">${a > 1 ? `<span class="q">${a}×</span>` : ''}${esc(i.naam)}${sub ? `<small>${esc(sub)}</small>` : ''}</span>${knop}</div>`;
}

function reisHTML(){
  const r = R();
  const open = reisOpen ?? !Object.keys(r.gepakt).length;
  const actieven = r.actief.map(groep).filter(Boolean);
  const samenvatting = [r.nachten ? r.nachten + (r.nachten === 1 ? ' nacht' : ' nachten') : '', ...actieven.map(g => g.emoji + ' ' + g.naam)].filter(Boolean).join(' · ') || 'Kies waar je heen gaat';
  const chips = soort => S.groepen.filter(g => g.soort === soort).sort(opNaam)
    .map(g => `<button class="chip${r.actief.includes(g.id) ? ' on' : ''}" data-a="groepAan" data-x="${g.id}">${esc(g.emoji)} ${esc(g.naam)}</button>`).join('');
  return `<section class="card reis${open ? '' : ' dicht'}">
    <button class="reis-hd" data-a="reisOpen"><b>Deze reis</b><span>${open ? '' : esc(samenvatting)}</span><i>▾</i></button>
    ${open ? `<div class="nacht"><div class="l">Aantal nachten<small>${r.nachten ? `Kleding voor ${r.nachten + 1} dagen` : 'Vul in voor aantallen (sokken, outfits…)'}</small></div>
      <div class="step"><button data-a="nacht" data-x="-1" aria-label="Minder">−</button><b>${r.nachten || '–'}</b><button data-a="nacht" data-x="1" aria-label="Meer">+</button></div></div>
    <span class="lbl">📍 Bestemming</span><div class="chips wrapc">${chips('b') || '<span class="info">Nog geen bestemmingen</span>'}</div>
    <span class="lbl">🎯 Activiteit</span><div class="chips wrapc">${chips('a') || '<span class="info">Nog geen activiteiten</span>'}</div>` : ''}
  </section>`;
}

function lijstHTML(){
  const r = R(), L = lijst(), volg = catVolgorde();
  const open = L.filter(i => !r.gepakt[i.id] && !r.overslaan[i.id]);
  const gedaan = L.filter(i => r.gepakt[i.id] && !r.overslaan[i.id]).sort(opNaam);
  const over = L.filter(i => r.overslaan[i.id]).sort(opNaam);
  const totaal = open.length + gedaan.length;
  let h = `<div class="hd"><h1>Paklijst</h1>
    <button class="ic" data-a="nieuweReis" title="Nieuwe reis">↺</button>
    <button class="ic" data-a="instellingen" title="Instellingen">⚙</button></div>
    <div class="sub"><span>${totaal ? (open.length ? `${gedaan.length} van ${totaal} ingepakt` : 'Alles ingepakt, goede reis! 🎉') : 'Nog niets op je lijst'}</span><span class="sync" id="sync"></span></div>
    ${totaal ? `<div class="prog"><i style="width:${Math.round(gedaan.length / totaal * 100)}%"></i></div>` : ''}
    ${reisHTML()}
    <input class="search" id="zoek" data-i="zoek" placeholder="Zoek of voeg toe…" value="${esc(zoek)}" autocomplete="off">`;

  if (zoek.trim()){
    const q = zoek.trim().toLowerCase();
    const opLijst = L.filter(i => i.naam.toLowerCase().includes(q)).sort(opNaam);
    const ids = new Set(L.map(i => i.id));
    const nietOp = S.items.filter(i => !ids.has(i.id) && i.naam.toLowerCase().includes(q)).sort(opNaam);
    h += `<h3 class="sec">Op je lijst <span class="n">${opLijst.length}</span></h3>`;
    h += opLijst.length ? `<div class="card">${opLijst.map(i => rij(i, r.overslaan[i.id] ? 'over' : r.gepakt[i.id] ? 'gedaan' : 'open')).join('')}</div>` : `<p class="info">Niets gevonden op je lijst.</p>`;
    if (nietOp.length){
      h += `<h3 class="sec">Uit je items <span class="n">tik om mee te nemen</span></h3><div class="card">` + nietOp.map(i => {
        const c = cat(i.cat), gs = i.groepen.map(groep).filter(Boolean).map(g => g.emoji).join(' ');
        return `<div class="add-lib"><span class="t">${esc(i.naam)}<small>${esc(c ? c.emoji + ' ' + c.naam : '')}${gs ? ' · ' + esc(gs) : ''}</small></span><button class="btn" data-a="extraToe" data-x="${i.id}">+ Mee</button></div>`;
      }).join('') + `</div>`;
    }
    h += `<button class="btn block" style="margin-top:14px" data-a="toevoegen">+ “${esc(zoek.trim())}” als nieuw item</button>`;
    return h;
  }

  if (!L.length){
    return h + `<div class="empty"><b>Waar ga je heen?</b>Kies hierboven een bestemming of activiteit,<br>of zet items op ‘altijd mee’ bij Items.</div>`;
  }
  const normaal = open.filter(i => !i.laatst), laatst = open.filter(i => i.laatst).sort(opNaam);
  const perCat = {};
  normaal.forEach(i => (perCat[i.cat] = perCat[i.cat] || []).push(i));
  Object.keys(perCat).sort((a, b) => volg(a) - volg(b)).forEach(cid => {
    const c = cat(cid), its = perCat[cid].sort(opNaam);
    h += `<h3 class="sec">${esc(c ? c.emoji + ' ' + c.naam : '📦 Overig')} <span class="n">${its.length}</span></h3><div class="card">${its.map(i => rij(i, 'open')).join('')}</div>`;
  });
  if (!normaal.length && !laatst.length) h += `<div class="empty"><b>Klaar!</b>Alles is ingepakt.</div>`;
  if (laatst.length){
    h += `<h3 class="sec">🌅 Laatste moment <span class="n">pak je op de dag zelf</span></h3><div class="card warm">${laatst.map(i => rij(i, 'open')).join('')}</div>`;
  }
  if (gedaan.length) h += `<details class="blok"><summary>✓ Ingepakt <span class="n">${gedaan.length}</span></summary><div class="card">${gedaan.map(i => rij(i, 'gedaan')).join('')}</div></details>`;
  if (over.length) h += `<details class="blok"><summary>Overgeslagen <span class="n">${over.length}</span></summary><div class="card">${over.map(i => rij(i, 'over')).join('')}</div></details>`;
  return h + `<button class="fab" data-a="toevoegen">+ Item</button>`;
}

function inFilter(i){
  if (filter === 'alles') return true;
  if (filter === 'altijd') return i.altijd;
  if (filter === 'laatst') return i.laatst;
  return i.groepen.includes(filter);
}
function itemsHTML(){
  const koppelbaar = filter !== 'alles';
  const volg = catVolgorde(), q = zoek.trim().toLowerCase();
  const fChip = (id, label) => `<button class="chip${filter === id ? ' on' : ''}" data-a="filter" data-x="${id}">${label}</button>`;
  const gesorteerd = [...S.groepen].sort((a, b) => (a.soort === b.soort ? 0 : a.soort === 'b' ? -1 : 1) || opNaam(a, b));
  let h = `<div class="hd"><h1>Items</h1><button class="ic" data-a="instellingen" title="Instellingen">⚙</button></div>
    <div class="sub"><span>${S.items.length} items · bepaal wat wanneer mee moet</span><span class="sync" id="sync"></span></div>
    <div class="chips">${fChip('alles', 'Alles')}${fChip('altijd', '⭐ Altijd mee')}${fChip('laatst', '🌅 Laatste moment')}${gesorteerd.map(g => fChip(g.id, esc(g.emoji) + ' ' + esc(g.naam))).join('')}</div>`;
  if (koppelbaar){
    const n = S.items.filter(inFilter).length;
    h += `<div class="seg"><button class="${koppelAlles ? '' : 'on'}" data-a="koppelModus" data-x="0">Aan (${n})</button><button class="${koppelAlles ? 'on' : ''}" data-a="koppelModus" data-x="1">Alle items</button></div>`;
  }
  h += `<input class="search" id="zoek" data-i="zoek" placeholder="Zoek item…" value="${esc(zoek)}" autocomplete="off">`;
  const zichtbaar = S.items.filter(i => (!koppelbaar || koppelAlles || inFilter(i)) && (!q || i.naam.toLowerCase().includes(q)));
  if (!zichtbaar.length){
    h += `<div class="empty"><b>${q ? 'Niets gevonden' : 'Nog leeg'}</b>${koppelbaar && !q ? 'Kies ‘Alle items’ om items aan te zetten.' : ''}</div>`;
  }
  const perCat = {};
  zichtbaar.forEach(i => (perCat[i.cat] = perCat[i.cat] || []).push(i));
  Object.keys(perCat).sort((a, b) => volg(a) - volg(b)).forEach(cid => {
    const c = cat(cid), its = perCat[cid].sort(opNaam);
    h += `<h3 class="sec">${esc(c ? c.emoji + ' ' + c.naam : '📦 Overig')} <span class="n">${its.length}</span></h3><div class="card">`;
    its.forEach(i => {
      const info = [i.altijd ? '⭐ altijd' : '', ...i.groepen.map(groep).filter(Boolean).map(g => g.emoji + ' ' + g.naam), i.laatst ? '🌅 laatste moment' : '',
        i.perDagen ? (i.perDagen === 1 ? '1 per dag' : `1 per ${i.perDagen} dagen`) + (i.max ? ` (max ${i.max})` : '') : ''].filter(Boolean).join(' · ');
      h += `<div class="it"><button class="t" data-a="bewerk" data-x="${i.id}">${esc(i.naam)}<small>${esc(info || 'alleen als je het toevoegt')}</small></button>
        ${koppelbaar ? `<label class="switch"><input type="checkbox" data-i="koppel" data-x="${i.id}"${inFilter(i) ? ' checked' : ''}><span class="sl"></span></label>` : ''}</div>`;
    });
    h += `</div>`;
  });
  return h + `<button class="fab" data-a="nieuwItem">+ Nieuw item</button>`;
}

function openSheet(s){ sheet = s; tekenSheet(); }
function sluitSheet(){ sheet = null; $('sheet-root').innerHTML = ''; }
function catOpties(gekozen){ return S.cats.map(c => `<option value="${c.id}"${c.id === gekozen ? ' selected' : ''}>${esc(c.emoji)} ${esc(c.naam)}</option>`).join(''); }
function swHTML(key, aan, titel, uitleg){

      </select>${d.perDagen ? `<input type="number" min="0" inputmode="numeric" data-i="ed" data-k="max" value="${d.max || ''}" placeholder="max" style="width:80px;flex:none;padding:10px 12px;border-radius:12px;font-size:15px">` : ''}</div>

  else if (sheet.type === 'toevoegen'){
    titel = 'Item toevoegen';

    body = `<form data-f="toevoegen"><span class="lbl">Naam</span><input id="nw-naam" data-i="nwNaam" value="${esc(sheet.naam)}" placeholder="Wat moet er mee?" autocomplete="off"></form>
      <div id="sugg">${suggHTML()}</div>
      <span class="lbl">Categorie</span><select data-i="nw" data-k="cat">${catOpties(sheet.cat)}</select>
      <span class="lbl">Bewaren als</span><div class="chips wrapc">${opties.map(([id, l]) => `<button class="chip${sheet.bewaar === id ? ' on' : ''}" data-a="nwBewaar" data-x="${id}">${esc(l)}</button>`).join('')}</div>
      <div style="margin-top:10px">${swHTML('nwLaatst', sheet.laatst, '🌅 Laatste moment', 'Pak je pas op de dag zelf in')}</div>`;
    voet = `<button class="btn" data-a="sluit">Annuleren</button><button class="btn pri" data-a="nwOpslaan">Toevoegen</button>`;
  }
  else if (sheet.type === 'instellingen'){
    titel = 'Instellingen';
    const gRij = g => `<div class="setrow"><input class="em" data-c="gEmoji" data-x="${g.id}" value="${esc(g.emoji)}"><input data-c="gNaam" data-x="${g.id}" value="${esc(g.naam)}">
      <select data-c="gSoort" data-x="${g.id}"><option value="b"${g.soort === 'b' ? ' selected' : ''}>📍</option><option value="a"${g.soort === 'a' ? ' selected' : ''}>🎯</option></select>
      <button class="xs" data-a="gWeg" data-x="${g.id}" title="Verwijderen">✕</button></div>`;
    const cRij = (c, k) => `<div class="setrow"><input class="em" data-c="cEmoji" data-x="${c.id}" value="${esc(c.emoji)}"><input data-c="cNaam" data-x="${c.id}" value="${esc(c.naam)}">
      <button class="xs" data-a="cOp" data-x="${c.id}" ${k === 0 ? 'disabled style="opacity:.3"' : ''} title="Omhoog">↑</button>
      <button class="xs" data-a="cWeg" data-x="${c.id}" title="Verwijderen">✕</button></div>`;
    const sorted = [...S.groepen].sort((a, b) => (a.soort === b.soort ? 0 : a.soort === 'b' ? -1 : 1) || opNaam(a, b));
    body = `<details class="set" data-open="groepen"${sheet.open === 'groepen' ? ' open' : ''}><summary>📍 Bestemmingen & 🎯 activiteiten</summary><div class="in">
        <p class="info">Welke items erbij horen stel je in bij <b>Items</b>: kies daar de bestemming of activiteit.</p>
        ${sorted.map(gRij).join('')}
        <form data-f="gToe" class="setrow" style="margin-top:8px"><input class="em" id="g-emoji" placeholder="🙂"><input id="g-naam" placeholder="Nieuwe…">
          <select id="g-soort"><option value="a">🎯</option><option value="b">📍</option></select><button class="xs" style="background:var(--accent);color:var(--on-accent);border-color:var(--accent)">+</button></form>
      </div></details>
      <details class="set" data-open="cats"${sheet.open === 'cats' ? ' open' : ''}><summary>🗂️ Categorieën</summary><div class="in">
        <p class="info">Categorieën bepalen alleen hoe je lijst is ingedeeld, in deze volgorde.</p>
        ${S.cats.map(cRij).join('')}
        <form data-f="cToe" class="setrow" style="margin-top:8px"><input class="em" id="c-emoji" placeholder="📦"><input id="c-naam" placeholder="Nieuwe categorie…">
          <button class="xs" style="background:var(--accent);color:var(--on-accent);border-color:var(--accent)">+</button></form>
      </div></details>
      ${DEMO ? '<p class="info" style="margin-top:14px">Demo-modus: gegevens staan alleen in deze browser.</p>' : `<details class="set" data-open="acc"${sheet.open === 'acc' ? ' open' : ''}><summary>👤 Account</summary><div class="in">
        <p class="info">Ingelogd als ${esc(user?.displayName || user?.email || '')}. Je lijst wordt bewaard in je account en is op al je apparaten hetzelfde.</p>
        <button class="btn block" data-a="logout">Uitloggen</button></div></details>`}`;
  }
  $('sheet-root').innerHTML = `<div class="ov" data-a="ovSluit"><div class="sheet"><div class="handle"></div>
    <div class="sh"><h2>${titel}</h2><button class="ic" data-a="sluit" title="Sluiten">✕</button></div>
    <div class="sb">${body}</div>${voet ? `<div class="sf">${voet}</div>` : ''}</div></div>`;
}
function suggHTML(){
  const q = (sheet?.naam || '').trim().toLowerCase(); if (!q) return '';
  const ids = new Set(lijst().map(i => i.id));
  const m = S.items.filter(i => !ids.has(i.id) && i.naam.toLowerCase().includes(q)).sort(opNaam).slice(0, 5);
  if (!m.length) return '';
  return `<span class="lbl">Bestaat al in je items</span><div class="card">` + m.map(i => {
    const c = cat(i.cat);
    return `<div class="add-lib"><span class="t">${esc(i.naam)}<small>${esc(c ? c.emoji + ' ' + c.naam : '')}</small></span><button class="btn" data-a="extraToe" data-x="${i.id}">+ Mee</button></div>`;
  }).join('') + `</div>`;
}

// =====================================================================
//  ACTIES
// =====================================================================
const A = {
  tab(x){ tab = x; zoek = ''; render(); scrollTo(0, 0); },
  login(){ login(); },
  logout(){ if (!confirm('Uitloggen?')) return; sluitSheet(); localStorage.removeItem(LS_KEY); auth.signOut(); },
  sluit(){ sluitSheet(); },
  ovSluit(x, el, ev){ if (ev.target === el) sluitSheet(); },
  instellingen(){ openSheet({type:'instellingen', open:'groepen'}); },
  reisOpen(){ const r = R(); reisOpen = !(reisOpen ?? !Object.keys(r.gepakt).length); render(); },
  nacht(x){ const r = R(); r.nachten = Math.max(0, Math.min(60, (r.nachten || 0) + Number(x))); opslaan(); render(); },
  groepAan(id){ const r = R(); r.actief = r.actief.includes(id) ? r.actief.filter(a => a !== id) : [...r.actief, id]; opslaan(); render(); },
  pak(id){ const r = R(); if (r.gepakt[id]) delete r.gepakt[id]; else r.gepakt[id] = true; opslaan(); render(); },
  slaOver(id){ const r = R(); r.overslaan[id] = true; delete r.gepakt[id]; opslaan(); render(); toast('Overgeslagen voor deze reis'); },
  terug(id){ delete R().overslaan[id]; opslaan(); render(); },
  losWeg(id){ const r = R(); r.los = r.los.filter(l => l.id !== id); delete r.gepakt[id]; opslaan(); render(); },
  extraWeg(id){ const r = R(); r.extra = r.extra.filter(e => e !== id); delete r.gepakt[id]; opslaan(); render(); },
  extraToe(id){
    const r = R(); if (!r.extra.includes(id)) r.extra.push(id); delete r.overslaan[id];
    opslaan(); const i = item(id); toast(`✓ ${i ? i.naam : 'Item'} gaat mee`);
    if (sheet?.type === 'toevoegen') sluitSheet();
    zoek = ''; render();
  },
  nieuweReis(){
    if (!confirm('Nieuwe reis beginnen? Afvinken, overgeslagen items, bestemmingen en losse items worden gewist. Je items blijven bewaard.')) return;
    S.reis = {nachten:0, actief:[], gepakt:{}, overslaan:{}, los:[], extra:[]}; reisOpen = true; zoek = '';
    opslaan(); render(); scrollTo(0, 0); toast('✓ Klaar voor een nieuwe reis');
  },
  toevoegen(){
    const naam = tab === 'lijst' ? zoek.trim() : '';
    openSheet({type:'toevoegen', naam, cat: standaardCat(), bewaar:'reis', laatst:false});
    setTimeout(() => $('nw-naam')?.focus(), 60);
  },
  nwBewaar(x){ sheet.bewaar = x; tekenSheet(); },
  nwOpslaan(){
    const naam = (sheet.naam || '').trim(); if (!naam){ $('nw-naam')?.focus(); return; }
    const r = R(); A._laatsteCat = sheet.cat;
    let bestaand = S.items.find(i => zelfde(i.naam, naam));
    if (sheet.bewaar === 'reis' && !bestaand){
      r.los.push({id:'l_' + nid(), naam, cat:sheet.cat, laatst:sheet.laatst});
    } else {
      if (!bestaand){ bestaand = {id:'i_' + nid(), naam, cat:sheet.cat, altijd:false, groepen:[], laatst:sheet.laatst, perDagen:0, max:0}; S.items.push(bestaand); }
      if (sheet.bewaar === 'altijd') bestaand.altijd = true;
      else if (sheet.bewaar !== 'reis' && !bestaand.groepen.includes(sheet.bewaar)) bestaand.groepen.push(sheet.bewaar);
      if (!lijst().some(i => i.id === bestaand.id)) r.extra.push(bestaand.id);
      delete r.overslaan[bestaand.id];
    }
    opslaan(); sluitSheet(); zoek = ''; render(); toast(`✓ ${naam} toegevoegd`);
  },
  filter(x){ filter = x; koppelAlles = false; render(); },
  koppelModus(x){ koppelAlles = x === '1'; render(); },
  bewerk(id){ const i = item(id); if (!i) return; openSheet({type:'item', id, nieuw:false, d:JSON.parse(JSON.stringify(i))}); },
  nieuwItem(){
    const d = {id:'i_' + nid(), naam:zoek.trim(), cat:standaardCat(), altijd:filter === 'altijd', groepen: groep(filter) ? [filter] : [], laatst:filter === 'laatst', perDagen:0, max:0};
    openSheet({type:'item', nieuw:true, d}); setTimeout(() => $('ed-naam')?.focus(), 60);
  },
  edGroep(id){ const d = sheet.d; d.groepen = d.groepen.includes(id) ? d.groepen.filter(g => g !== id) : [...d.groepen, id]; tekenSheet(); },
  edOpslaan(){
    const d = sheet.d; d.naam = d.naam.trim();
    if (!d.naam){ $('ed-naam')?.focus(); return; }
    if (S.items.some(i => i.id !== d.id && zelfde(i.naam, d.naam)) && !confirm(`Er is al een item “${d.naam}”. Toch opslaan?`)) return;
    A._laatsteCat = d.cat;
    if (sheet.nieuw) S.items.push(d); else S.items = S.items.map(i => i.id === d.id ? d : i);
    opslaan(); sluitSheet(); render(); toast('✓ Opgeslagen');
  },
  edWeg(){
    const d = sheet.d; if (!confirm(`“${d.naam}” verwijderen uit al je lijsten?`)) return;
    S.items = S.items.filter(i => i.id !== d.id);
    const r = R(); delete r.gepakt[d.id]; delete r.overslaan[d.id]; r.extra = r.extra.filter(e => e !== d.id);
    opslaan(); sluitSheet(); render(); toast('Verwijderd');
  },
  gWeg(id){
    const g = groep(id); if (!g) return;
    const n = S.items.filter(i => i.groepen.includes(id)).length;
    if (!confirm(`“${g.naam}” verwijderen?${n ? ` De ${n} items blijven bestaan, maar horen er niet meer bij.` : ''}`)) return;
    S.groepen = S.groepen.filter(x => x.id !== id);
    S.items.forEach(i => i.groepen = i.groepen.filter(x => x !== id));
    R().actief = R().actief.filter(x => x !== id);
    if (filter === id) filter = 'alles';
    opslaan(); tekenSheet(); render();
  },
  cOp(id){ const k = S.cats.findIndex(c => c.id === id); if (k > 0){ [S.cats[k - 1], S.cats[k]] = [S.cats[k], S.cats[k - 1]]; opslaan(); tekenSheet(); render(); } },
  cWeg(id){
    if (S.cats.length < 2){ toast('Je hebt minstens één categorie nodig'); return; }
    const c = cat(id), rest = S.cats.filter(x => x.id !== id), doel = rest.find(x => /overig|rest/i.test(x.naam)) || rest[0];
    const n = S.items.filter(i => i.cat === id).length + R().los.filter(l => l.cat === id).length;
    if (!confirm(`“${c.naam}” verwijderen?${n ? ` De ${n} items erin gaan naar ${doel.emoji} ${doel.naam}.` : ''}`)) return;
    S.items.forEach(i => { if (i.cat === id) i.cat = doel.id; }); R().los.forEach(l => { if (l.cat === id) l.cat = doel.id; });
    S.cats = rest; opslaan(); tekenSheet(); render();
  },
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  if (el.tagName === 'LABEL') return;
  const fn = A[el.dataset.a]; if (fn){ if (el.tagName === 'BUTTON') ev.preventDefault(); fn(el.dataset.x, el, ev); }
});
document.addEventListener('input', ev => {
  const el = ev.target, k = el.dataset?.i; if (!k) return;
  if (k === 'zoek'){ zoek = el.value; render(); }
  else if (k === 'nwNaam'){ sheet.naam = el.value; $('sugg').innerHTML = suggHTML(); }
  else if (k === 'ed' && el.tagName === 'INPUT'){ const f = el.dataset.k; sheet.d[f] = f === 'max' ? Math.max(0, parseInt(el.value) || 0) : el.value; }
});
document.addEventListener('change', ev => {
  const el = ev.target, k = el.dataset?.i, c = el.dataset?.c;
  if (k === 'koppel'){
    const i = item(el.dataset.x); if (!i) return;
    if (filter === 'altijd') i.altijd = el.checked;
    else if (filter === 'laatst') i.laatst = el.checked;
    else i.groepen = el.checked ? [...new Set([...i.groepen, filter])] : i.groepen.filter(g => g !== filter);
    opslaan(); setTimeout(render, koppelAlles ? 0 : 250);
  }
  else if (k === 'sw'){
    const f = el.dataset.k;
    if (f === 'nwLaatst') sheet.laatst = el.checked; else sheet.d[f] = el.checked;
  }
  else if (k === 'ed' && el.tagName === 'SELECT'){
    const f = el.dataset.k; sheet.d[f] = f === 'perDagen' ? Number(el.value) : el.value; if (f === 'perDagen') tekenSheet();
  }
  else if (k === 'nw'){ sheet[el.dataset.k] = el.value; }
  else if (c){
    const id = el.dataset.x, v = el.value.trim();
    if (c[0] === 'g'){ const g = groep(id); if (!g) return; if (c === 'gNaam' && v) g.naam = v; if (c === 'gEmoji' && v) g.emoji = v; if (c === 'gSoort') g.soort = v; }
    else { const x = cat(id); if (!x) return; if (c === 'cNaam' && v) x.naam = v; if (c === 'cEmoji' && v) x.emoji = v; }
    opslaan(); render();
  }
});
document.addEventListener('submit', ev => {
  const f = ev.target.dataset?.f; if (!f) return; ev.preventDefault();
  if (f === 'toevoegen') A.nwOpslaan();
  if (f === 'gToe'){
    const naam = $('g-naam').value.trim(); if (!naam) return;
    if (S.groepen.some(g => zelfde(g.naam, naam))){ toast('Die bestaat al'); return; }
    const soort = $('g-soort').value;
    S.groepen.push({id:'g_' + nid(), naam, emoji:$('g-emoji').value.trim() || (soort === 'b' ? '📍' : '🎯'), soort});
    sheet.open = 'groepen'; opslaan(); tekenSheet(); render(); $('g-naam')?.focus();
  }
  if (f === 'cToe'){
    const naam = $('c-naam').value.trim(); if (!naam) return;
    if (S.cats.some(c => zelfde(c.naam, naam))){ toast('Die bestaat al'); return; }
    S.cats.push({id:'c_' + nid(), naam, emoji:$('c-emoji').value.trim() || '📦'});
    sheet.open = 'cats'; opslaan(); tekenSheet(); render(); $('c-naam')?.focus();
  }
});
document.addEventListener('toggle', ev => { const d = ev.target; if (d.matches?.('details.set') && d.open && sheet) sheet.open = d.dataset.open; }, true);
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && sheet) sluitSheet();
  if (ev.key === 'Enter' && ev.target.id === 'zoek' && tab === 'lijst' && zoek.trim()){ ev.target.blur(); A.toevoegen(); }
});

// =====================================================================
//  AUTH & START
// =====================================================================
function login(){
  const st = $('login-status'); st.textContent = 'Bezig met inloggen…';
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(e => {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') auth.signInWithRedirect(provider);
    else st.textContent = e.code === 'auth/popup-closed-by-user' ? '' : 'Inloggen mislukt: ' + e.message;
  });
}
function init(){
  if (DEMO){
    try { const c = localStorage.getItem(LS_KEY); S = c ? vulAan(JSON.parse(c)) : migreer(leesOud()); } catch(e){ S = migreer({}); }
    opslaan(); $('app').classList.remove('hidden'); render(); return;
  }
  if (!FIREBASE_CONFIG.apiKey){
    $('login').classList.remove('hidden');
    $('login-status').textContent = 'Firebase is nog niet ingesteld. Open de app met ?demo om te testen.';
    document.querySelector('[data-a="login"]').classList.add('hidden');
    return;
  }
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore(); auth = firebase.auth();
  auth.onAuthStateChanged(u => {
    if (!u){ user = null; $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('login-status').textContent = ''; return; }
    user = u; start();
  });
}
init();
</script>
</body>
